<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RT Lab Unified Medical &amp; Financial ERP</title>
    <script>
      (function () {
        var path = window.location.pathname || '/';
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        // Preserve GitHub Pages repository base (/rt-lab-unified-system/) and map subpath to hash route
        var repoBase = '/rt-lab-unified-system/';
        var base = path.indexOf(repoBase) === 0 ? repoBase : '/';
        var sub = path.slice(base.length).replace(/^\/+|\/+$/g, '');
        var targetHash = hash || (sub ? '#' + sub : '');
        window.location.replace(base + search + targetHash);
      })();
    </script>
  </head>
  <body style="background:#0f172a;color:#f8fafc;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0">
    <div style="text-align:center">
      <p>جاري تحويلك إلى منظومة معامل RT...</p>
    </div>
  </body>
</html>
